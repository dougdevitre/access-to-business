name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check SKILL.md frontmatter meets the claude.ai upload rules
        run: |
          python3 -c 'import yaml' 2>/dev/null || python3 -m pip install --quiet pyyaml
          python3 .github/scripts/check-skill-frontmatter.py SKILL.md access-to-business

      - name: Validate JSON files
        run: |
          echo "Validating JSON files..."
          for f in $(find . -name "*.json" -not -path "./.git/*"); do
            echo "  Checking $f"
            python3 -c "import json; json.load(open('$f'))" || exit 1
          done
          echo "All JSON files valid."

      - name: Check MANIFEST.json counts
        run: |
          echo "Checking MANIFEST.json accuracy..."
          PLAYBOOK_COUNT=$(find references/playbooks -name "*.md" ! -name "README.md" | wc -l)
          MANIFEST_PLAYBOOKS=$(python3 -c "import json; print(json.load(open('MANIFEST.json'))['playbooks'])")
          echo "  Playbooks on disk: $PLAYBOOK_COUNT"
          echo "  MANIFEST claims: $MANIFEST_PLAYBOOKS"
          if [ "$PLAYBOOK_COUNT" -lt "$MANIFEST_PLAYBOOKS" ]; then
            echo "ERROR: MANIFEST.json claims $MANIFEST_PLAYBOOKS playbooks but only $PLAYBOOK_COUNT found"
            exit 1
          fi

          DIR_COUNT=$(python3 -c "import json; dirs=json.load(open('MANIFEST.json'))['reference_directories']; print(len(dirs))")
          echo "  Reference directories in MANIFEST: $DIR_COUNT"
          python3 -c "
          import json, os
          dirs = json.load(open('MANIFEST.json'))['reference_directories']
          missing = [d for d in dirs if not os.path.isdir(d)]
          if missing:
              print(f'ERROR: Missing directories: {missing}')
              exit(1)
          print('  All reference directories exist.')
          "

      - name: Check for broken internal links in SKILL.md
        run: |
          echo "Checking SKILL.md internal file references..."
          python3 -c "
          import re, os
          with open('SKILL.md') as f:
              content = f.read()
          paths = re.findall(r'\x60(references/[^\x60\s]+\.md)\x60', content)
          missing = [p for p in paths if not os.path.exists(p)]
          if missing:
              print('ERROR: SKILL.md references files that do not exist:')
              for m in missing:
                  print(f'  - {m}')
              exit(1)
          print(f'  All {len(paths)} file references in SKILL.md exist.')
          "

      - name: Validate eval test cases
        run: |
          echo "Validating eval-set.json..."
          python3 -c "
          import json
          data = json.load(open('evals/eval-set.json'))
          cases = data['test_cases']
          ids = [c['id'] for c in cases]
          dupes = [i for i in ids if ids.count(i) > 1]
          if dupes:
              print(f'ERROR: Duplicate eval IDs: {set(dupes)}')
              exit(1)
          positive = sum(1 for c in cases if c['should_trigger'])
          negative = sum(1 for c in cases if not c['should_trigger'])
          print(f'  {len(cases)} test cases ({positive} positive, {negative} negative)')
          for c in cases:
              if c['should_trigger'] and not c.get('expected_route'):
                  print(f'ERROR: {c[\"id\"]} triggers but has no expected_route')
                  exit(1)
          print('  All test cases valid.')
          "

      - name: Check playbook cross-references
        run: |
          echo "Checking playbook cross-references..."
          python3 -c "
          import re, os, glob
          errors = []
          for f in glob.glob('references/playbooks/*.md'):
              with open(f) as fh:
                  content = fh.read()
              links = re.findall(r'\[([^\]]+)\]\(([^)]+\.md)\)', content)
              for text, target in links:
                  target_path = os.path.join(os.path.dirname(f), target)
                  if not os.path.exists(target_path):
                      errors.append(f'{f}: broken link to {target}')
          if errors:
              print('ERROR: Broken cross-references:')
              for e in errors:
                  print(f'  - {e}')
              exit(1)
          print('  All playbook cross-references valid.')
          "

      # facts/ledger.json: every phone number, dollar figure, deadline and
      # program-status claim, with its primary source and verified date. Fails
      # when a fact is past its recheck date, a listed file is missing, or the
      # text no longer carries the ledger's value.
      - name: Check the fact ledger
        run: |
          node --test scripts/test/check-facts.test.mjs
          node scripts/check-facts.mjs

      - name: Check in-app disclaimer
        run: |
          echo "Checking the disclaimer in every app..."
          python3 - <<'PY'
          import glob, re
          NOTICE = ("Educational information only. Access to Business is not legal, medical, "
                    "mental health, financial or safety advice, and using it creates no "
                    "professional relationship. In danger now? Call 911. For crisis support, "
                    "call or text 988. Confirm anything important with the official source "
                    "or a licensed professional.")
          FULL_LINK = "https://github.com/dougdevitre/access-to-business/blob/main/DISCLAIMER.md"
          pages = sorted(glob.glob("apps/*.html"))
          errors = [] if pages else ["no apps found in apps/"]
          for f in pages:
              html = open(f, encoding="utf-8").read()
              text = re.sub(r"\s+", " ", re.sub(r"<[^>]+>", "", html))
              notice = html.find('class="atd-notice"')
              checks = {
                  "short notice text": NOTICE in text,
                  "911 as a tel: link": re.search(r'<a[^>]*href="tel:911"[^>]*>911</a>', html),
                  "988 as a tel: link": re.search(r'<a[^>]*href="tel:988"[^>]*>988</a>', html),
                  "link to the full disclaimer": FULL_LINK in html,
                  "notice shown before the app": -1 < notice < html.find("<h1"),
                  "labelled acknowledgment dialog": re.search(r'<dialog[^>]*aria-labelledby="atd-ack-title"', html),
                  "I understand button": ">I understand</button>" in html,
                  "versioned storage key": '"disclaimer-ack-v1"' in html,
                  "storage reads and writes guarded": len(re.findall(r"try \{[^}]*(localStorage|getItem|setItem)", html)) >= 3,
                  "Esc does not dismiss": re.search(r'addEventListener\("cancel"[\s\S]*?preventDefault\(\)', html),
              }
              for name, ok in checks.items():
                  if not ok:
                      errors.append(f"{f}: missing {name}")
          if errors:
              print("ERROR: In-app disclaimer checks failed:")
              for e in errors:
                  print(f"  - {e}")
              raise SystemExit(1)
          print(f"  Disclaimer present in all {len(pages)} apps.")
          PY

      - name: Check apps do not require identifying details
        run: |
          echo "Checking that no app requires a name or copies it into the Claude prompt..."
          python3 - <<'PY'
          import glob, re

          def body(src, fn):
              """Source of `function fn(...) { ... }`, or None if it is missing."""
              m = re.search(r"function\s+" + fn + r"\s*\([^)]*\)\s*\{", src)
              if not m:
                  return None
              i, depth = m.end(), 1
              while depth and i < len(src):
                  depth += {"{": 1, "}": -1}.get(src[i], 0)
                  i += 1
              return src[m.end():i - 1]

          NAME_REF = re.compile(r"data\s*(\.\s*name\b|\[\s*['\"]name['\"]\s*\])")
          IDENTIFYING = re.compile(r"\b(name|e-?mail|phone|telephone|address)\b", re.I)
          pages = sorted(glob.glob("apps/*.html"))
          errors = [] if pages else ["no apps found in apps/"]

          # Any field asking for a name, email, phone or address must say it is optional.
          for f in pages:
              html = open(f, encoding="utf-8").read()
              for label in re.findall(r"<label\b[^>]*>(.*?)</label>", html, re.S):
                  text = re.sub(r"\s+", " ", re.sub(r"<[^>]+>", "", label)).strip()
                  if IDENTIFYING.search(text) and "(optional)" not in text:
                      errors.append(f"{f}: field '{text}' asks for identifying details but is not marked (optional)")
              for tag in re.findall(r"<input\b[^>]*>", html):
                  if re.search(r'type\s*=\s*["\'](email|tel)["\']', tag) and "required" in tag:
                      errors.append(f"{f}: required email or phone input: {tag}")

          # The intake app: the name is optional, on screen only, never in the copied prompt.
          f = "apps/intake-app.html"
          html = open(f, encoding="utf-8").read()
          copy_fn, next_fn = body(html, "getCopyText"), body(html, "canNext")
          name_input = re.search(r"<input\b[^>]*\bid=\"inp-name\"[^>]*>", html)
          copy_lines = [l for l in html.splitlines() if re.search(r"copyText|writeText", l)]
          checks = {
              "copy text built by getCopyText()": copy_fn is not None,
              "copy text leaves out the name": copy_fn is not None and not NAME_REF.search(copy_fn)
                  and not any(NAME_REF.search(l) for l in copy_lines),
              "step validation in canNext()": next_fn is not None,
              "name not required to continue": next_fn is not None and not NAME_REF.search(next_fn),
              "name field labelled as optional": re.search(
                  r'<label for="inp-name">First name or initials \(optional\)</label>', html),
              "name field has no required attribute": name_input and not re.search(r"\brequired\b", name_input.group(0)),
          }
          for name, ok in checks.items():
              if not ok:
                  errors.append(f"{f}: failed: {name}")
          if errors:
              print("ERROR: Identifying-details checks failed:")
              for e in errors:
                  print(f"  - {e}")
              raise SystemExit(1)
          print(f"  No app requires identifying details ({len(pages)} apps); the intake prompt leaves out the name.")
          PY

      - name: Check apps work on phones and with a keyboard
        run: |
          echo "Checking input heights, focus rings, labels, radio groups and landmarks..."
          python3 - <<'PY'
          import glob, re

          def css_rules(html):
              """(selector, declarations) for every innermost rule in the page's <style> blocks."""
              css = re.sub(r"/\*.*?\*/", "", "".join(re.findall(r"<style[^>]*>(.*?)</style>", html, re.S)), flags=re.S)
              rules, stack, start = [], [], 0
              for i, ch in enumerate(css):
                  if ch == "{":
                      stack.append((css[start:i].strip(), i + 1))
                      start = i + 1
                  elif ch == "}":
                      if stack:
                          sel, body_start = stack.pop()
                          body = css[body_start:i]
                          if "{" not in body and not sel.startswith("@"):
                              rules.append((sel, body))
                      start = i + 1
              return rules

          def body(src, fn):
              m = re.search(r"function\s+" + fn + r"\s*\([^)]*\)\s*\{", src)
              if not m:
                  return None
              i, depth = m.end(), 1
              while depth and i < len(src):
                  depth += {"{": 1, "}": -1}.get(src[i], 0)
                  i += 1
              return src[m.end():i - 1]

          def px(decls, prop):
              return [float(v) for v in re.findall(r"(?:^|[;\s])" + prop + r"\s*:\s*(\d+(?:\.\d+)?)px", decls)]

          # A selector part that styles a text box: an input/textarea/select tag (not a class
          # such as .opt-input), not limited to checkboxes or radios, with no :pseudo-class.
          FIELD_TAG = re.compile(r"(?<![\w.#-])(input|textarea|select)\b")
          def text_field_parts(sel):
              return [p.strip() for p in sel.split(",") if FIELD_TAG.search(p)
                      and not re.search(r'type="?(checkbox|radio)', p)]

          pages = sorted(glob.glob("apps/*.html"))
          errors = [] if pages else ["no apps found in apps/"]
          for f in pages:
              html = open(f, encoding="utf-8").read()
              rules = css_rules(html)
              def fail(msg):
                  errors.append(f"{f}: {msg}")

              # Text boxes: textarea, select, or any input that is not a checkbox, radio, range or hidden.
              has_text_field = any(not re.search(r'type="(checkbox|radio|range|hidden)"', t)
                                   for t in re.findall(r"<(?:input|textarea|select)\b[^>]*>", html))

              # 1. Each kind of text box (input, textarea, select) is at least 44px tall,
              #    and no rule shrinks a field below that.
              if has_text_field:
                  kinds = {k for k in ("input", "textarea", "select")
                           if any(not re.search(r'type="(checkbox|radio|range|hidden)"', t)
                                  for t in re.findall(r"<" + k + r"\b[^>]*>", html))}
                  sized = set()
                  for sel, decls in rules:
                      parts = [p for p in text_field_parts(sel) if ":" not in p.replace("::", ":")]
                      if not parts:
                          continue
                      heights = px(decls, "min-height") + px(decls, "height")
                      if any(h >= 44 for h in heights):
                          sized |= {FIELD_TAG.search(p).group(1) for p in parts}
                      for h in heights:
                          if h < 44:
                              fail(f"'{sel}' sets a field height of {h:g}px (needs 44px or more)")
                  for k in sorted(kinds - sized):
                      fail(f"no CSS rule gives <{k}> text boxes a min-height of at least 44px")

              # 2. Focus is a visible ring, not only a border-colour change.
              for sel, decls in rules:
                  if text_field_parts(sel) and re.search(r"outline\s*:\s*(none|0)\b", decls):
                      fail(f"'{sel}' removes the focus outline from text boxes")
              ring = [sel for sel, decls in rules
                      if ":focus-visible" in sel and FIELD_TAG.search(sel)
                      and any(w >= 2 for w in px(decls, "outline") + px(decls, "outline-width"))]
              if has_text_field and not ring:
                  fail("no :focus-visible rule draws a 2px+ outline on text boxes")

              # 3. Every field is tied to its label: <label for> matching the field's id,
              #    or a radio/checkbox nested inside its <label>.
              label_for = set(re.findall(r'<label\b[^>]*\bfor="([^"]+)"', html))
              for m in re.finditer(r"<(input|textarea|select)\b[^>]*>", html):
                  tag = m.group(0)
                  fid = re.search(r'\bid="([^"]+)"', tag)
                  before = html[:m.start()]
                  nested = before.rfind("<label") > before.rfind("</label>")
                  if fid and (fid.group(1) in label_for or "aria-label" in tag):
                      continue
                  if re.search(r'type="(radio|checkbox)"', tag) and nested:
                      continue
                  fail(f"field is not tied to a label (needs <label for> matching its id): {tag[:70]}")
              for m in re.finditer(r"<label\b([^>]*)>(.*?)</label>", html, re.S):
                  if "for=" not in m.group(1) and not re.search(r"<(input|textarea|select)\b", m.group(2)):
                      text = re.sub(r"\s+", " ", re.sub(r"<[^>]+>|'\s*\+[^+]*\+\s*'", "", m.group(2))).strip()
                      fail(f"label '{text[:50]}' is not tied to a field")

              # 4. Choices are real controls: no clickable <div>/<span>.
              if re.search(r"<(div|span)\b[^>]*\bonclick=", html):
                  fail("a <div> or <span> has an onclick handler (use a button or radio)")
              if re.search(r"<(div|span)\b[^>]*class=\"option-btn", html):
                  fail("an .option-btn choice is a <div>/<span>, not a radio <label>")

              # 5. Landmarks and reduced motion.
              if "<main" not in html:
                  fail("no <main> landmark")
              if "transition" in html and not re.search(
                      r"@media\s*\(prefers-reduced-motion:\s*reduce\)\s*\{\s*\*[^{]*\{[^}]*transition:\s*none", html):
                  fail("has transitions but no prefers-reduced-motion block that turns them all off")

          # The intake app's stage, priority and time choices are labelled radio groups,
          # and the copied text uses the time's label, not its id.
          f = "apps/intake-app.html"
          html = open(f, encoding="utf-8").read()
          group_fn, copy_fn = body(html, "radioGroup"), body(html, "getCopyText")
          checks = {
              "radioGroup() builds the choices": group_fn is not None,
              "choices sit in role=radiogroup with aria-labelledby": group_fn is not None
                  and re.search(r'role="radiogroup" aria-labelledby="', group_fn),
              "each choice is a native radio inside its <label>": group_fn is not None
                  and re.search(r"<label[^>]*>'?[\s+']*'<input[^>]*type=\"radio\"", group_fn),
              "stage, priority and time all use radioGroup()": all(
                  re.search(r'radioGroup\(\s*"' + g + '"', html) for g in ("stage", "priority", "time")),
              "no click-only data-stage/priority/time choices": not re.search(r"data-(stage|priority|time)=", html),
              "copied text uses the time label": copy_fn is not None and "TIME_OPTIONS" in copy_fn
                  and not re.search(r"\+\s*data\.time\b", copy_fn),
          }
          for name, ok in checks.items():
              if not ok:
                  errors.append(f"{f}: failed: {name}")

          if errors:
              print("ERROR: Phone and keyboard checks failed:")
              for e in errors:
                  print(f"  - {e}")
              raise SystemExit(1)
          print(f"  All {len(pages)} apps: 44px text boxes, focus rings, tied labels, radio groups, <main>, reduced motion.")
          PY
